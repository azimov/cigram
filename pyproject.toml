[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cigram"
version = "0.2.0"
description = "Circular Gaussian Random gRAph Model - a generator for synthetic complex networks"
readme = "README.rst"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "James Gilbert", email = "jamie.gilbert@azimov.co.uk"}]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "inspyred>=1.0.1",
    "click>=8.0",
    "cma>=3.0",
    "netlsd>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/azimov/cigram"
Documentation = "https://cigram.readthedocs.org"
Visualization = "http://cigram.ico2s.org"

[tool.setuptools.packages.find]
include = ["cigram*"]
